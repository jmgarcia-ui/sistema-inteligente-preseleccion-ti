# Publica el frontend en Azure Static Web Apps cada vez que cambia apps/web en main
name: Publicar web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # la dirección de la API queda dentro del build
      - run: npm run build
        env:
          VITE_API_URL: https://api-preseleccion-ti.azurewebsites.net
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
